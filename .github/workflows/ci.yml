name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aicm
          POSTGRES_PASSWORD: aicm
          POSTGRES_DB: aicm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aicm" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      AICM_TEST_DATABASE_URL: postgres://aicm:aicm@localhost:5432/aicm?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: agent and hub cross-compile for every release target
        run: |
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/aicm-agent
          done
          for t in linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/aicm
          done
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: README providers table is current
        run: go run ./cmd/aicm providers --write README.md && git diff --exit-code README.md
      - run: go test -race ./...
      - name: sqlc generate leaves no diff
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/db
      - name: API codegen leaves no diff
        run: |
          go generate ./internal/httpapi ./internal/apiclient
          git diff --exit-code -- internal/httpapi internal/apiclient
      - name: migrations apply cleanly
        run: |
          go run ./cmd/aicm migrate up
          go run ./cmd/aicm migrate status
        env:
          AICM_DATABASE_URL: postgres://aicm:aicm@localhost:5432/aicm?sslmode=disable

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @redocly/cli@2 lint api/openapi.yaml

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: fsfe/reuse-action@v5
      - run: ./scripts/check-licenses.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose up serves a health check
        run: |
          docker compose up -d --build --wait db
          docker compose up -d --build hub
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/readyz && exit 0
            sleep 2
          done
          docker compose logs hub
          exit 1
