# oapi-codegen config for the hub's server side. Run: go generate ./internal/httpapi
package: httpapi
output: api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  skip-prune: true
  type-mapping:
    number:
      default: { type: float64 }
    string:
      formats:
        uuid: { type: string }
        email: { type: string }
