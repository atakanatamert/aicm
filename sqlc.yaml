version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type: { type: string, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
          - db_type: inet
            go_type: { import: net/netip, type: Addr }
          - db_type: inet
            nullable: true
            go_type: { import: net/netip, type: Addr, pointer: true }
          - db_type: pg_catalog.bpchar
            go_type: string
          - db_type: pg_catalog.bpchar
            nullable: true
            go_type: { type: string, pointer: true }
