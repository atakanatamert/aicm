# Self-hosted hub: `docker compose up`. Copy .env.example to .env first.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicm
      POSTGRES_PASSWORD: ${AICM_DB_PASSWORD:-aicm}
      POSTGRES_DB: aicm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicm -d aicm"]
      interval: 2s
      timeout: 3s
      retries: 30

  hub:
    build: .
    image: aicm:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AICM_DATABASE_URL: postgres://aicm:${AICM_DB_PASSWORD:-aicm}@db:5432/aicm?sslmode=disable
      AICM_PUBLIC_URL: ${AICM_PUBLIC_URL:-http://localhost:8080}
      AICM_LOG_LEVEL: ${AICM_LOG_LEVEL:-info}
      AICM_MASTER_KEY_FILE: /var/lib/aicm/master.key
      AICM_MASTER_KEY_GENERATE: "true"
    volumes:
      - hub-data:/var/lib/aicm
    ports:
      - "${AICM_PORT:-8080}:8080"

  # Nightly database dump plus a copy of the master key in ./backups (14 kept).
  # Restore both together: docs/operations.md.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${AICM_DB_PASSWORD:-aicm}
      # uid:gid that owns the backup files, e.g. "1000:1000"; root when empty.
      AICM_BACKUP_OWNER: ${AICM_BACKUP_OWNER:-}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
      # Read-write only so a restore can put master.key back (see README).
      - hub-data:/hub-data

volumes:
  db-data:
  hub-data:
